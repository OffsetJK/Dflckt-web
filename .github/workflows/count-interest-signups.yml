name: Count interest signups

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - name: Count Supabase interest signups
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "Missing repository secret: SUPABASE_URL"
            exit 1
          fi

          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "Missing repository secret: SUPABASE_SERVICE_ROLE_KEY"
            exit 1
          fi

          headers=$(mktemp)
          body=$(mktemp)

          status=$(curl -sS \
            -D "$headers" \
            -o "$body" \
            -w "%{http_code}" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Prefer: count=exact" \
            -H "Range: 0-0" \
            "$SUPABASE_URL/rest/v1/INTEREST_SIGNUPS?select=id")

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Supabase count request failed with HTTP $status"
            cat "$body"
            exit 1
          fi

          content_range=$(tr -d '\r' < "$headers" | awk 'tolower($1)=="content-range:" {print $2}' | tail -1)
          total=${content_range##*/}

          if [ -z "$total" ] || [ "$total" = "$content_range" ]; then
            echo "Could not read an exact count from Supabase response headers."
            echo "Content-Range: ${content_range:-missing}"
            exit 1
          fi

          echo "DFLCKT interest signups: $total"
          echo "No emails, ZIP codes, or row contents were fetched or printed."
