name: Validate V2 routing

on:
  push:
    branches:
      - experimental

jobs:
  validate-v2-routing:
    if: github.ref == 'refs/heads/experimental'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
    steps:
      - name: Check out experimental branch
        uses: actions/checkout@v4
        with:
          ref: experimental

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Inject Mapbox token for validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          p = Path('route.js')
          text = p.read_text()
          token = os.environ['MAPBOX_PUBLIC_TOKEN']
          if '__MAPBOX_PUBLIC_TOKEN__' not in text:
              raise SystemExit('Mapbox token placeholder not found')
          p.write_text(text.replace('__MAPBOX_PUBLIC_TOKEN__', token))
          PY

      - name: Run V2 routing validation
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MAPBOX_PUBLIC_TOKEN:-}"
          node scripts/validate-v2-routing.js
